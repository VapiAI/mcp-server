name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a release after its tag has been created.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile
        run: npm run build

  test:
    name: Node.js ${{ matrix.node-version }}
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check production and test code
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test packed package as a clean consumer
        run: npm run test:package

  release:
    needs: [compile, test]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Read metadata through the API; no package code runs with write access.
      - name: Select or create release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw+json' --jq '.version')
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a release version in package.json."
            exit 1
          fi
          tag="v$version"
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [[ -n $existing_sha && $existing_sha != "$GITHUB_SHA" ]]; then
            echo "Version $version is already tagged; bump package.json to release."
            exit 0
          fi
          if [[ -z $existing_sha ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          # GITHUB_TOKEN-created tags do not start another push workflow.
          # Continue packaging and publishing in this already-tested run.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Build the tested commit even if a tag is moved while CI runs.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: >-
          node -e "const version = require('./package.json').version;
          if ('v' + version !== process.env.RELEASE_TAG)
          throw new Error('Tag must match package version: v' + version)"

      - name: Pack npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      # Keep package code and caches out of the job with publishing authority.
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .release

      - name: Publish npm artifact
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          tarballs=(.release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::Expected exactly one npm package tarball."
            exit 1
          fi
          if [[ ${RELEASE_TAG} == *alpha* ]]; then
            npm publish "${tarballs[0]}" --access public --provenance --ignore-scripts --tag alpha
          elif [[ ${RELEASE_TAG} == *beta* ]]; then
            npm publish "${tarballs[0]}" --access public --provenance --ignore-scripts --tag beta
          else
            npm publish "${tarballs[0]}" --access public --provenance --ignore-scripts --tag latest
          fi
